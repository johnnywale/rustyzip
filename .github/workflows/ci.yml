name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - "feature*"

env:
  CARGO_TERM_COLOR: always

jobs:
  # -------------------------
  # Rust tests with coverage
  # -------------------------
  rust-test:
    name: Rust Tests & Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python (required for pyo3 tests)
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dev headers (required for pyo3 linking)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run Rust tests with coverage
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov --workspace --no-report
          cargo llvm-cov report
          cargo llvm-cov report --lcov --output-path lcov-rust.info

      - name: Upload Rust coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov-rust.info
          flags: rust
          name: rust-coverage
          fail_ci_if_error: false

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy -- -D warnings

      - name: Check coverage threshold (100%)
        run: |
          COVERAGE=$(cargo llvm-cov report --summary-only 2>/dev/null | grep "TOTAL" | awk '{print $NF}' | sed 's/%//')
          echo "Rust code coverage: $COVERAGE%"
          if (( $(echo "$COVERAGE < 100" | bc -l) )); then
            echo "⚠️  Coverage is below 100% target: $COVERAGE%"
            echo "Note: Aiming for 100% coverage. Current: $COVERAGE%"
            # For now, we'll warn but not fail. Remove 'exit 1' once we reach 100%
            # exit 1
          else
            echo "✅ Coverage meets 100% target"
          fi

  # -------------------------
  # Python tests (via maturin)
  # -------------------------
  python-test:
    name: Python Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        python-version: [ "3.8", "3.9", "3.10", "3.11", "3.12", "3.13" ]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install maturin and pytest
        run: pip install maturin pytest pytest-cov

      - name: Build wheel
        run: maturin build --release

      - name: Install wheel
        shell: bash
        run: pip install target/wheels/*.whl

      - name: Run Python tests
        run: pytest -v --import-mode=importlib --cov=rustyzipper --cov-report=xml --cov-report=term-missing

      - name: Upload Python coverage to Codecov
        uses: codecov/codecov-action@v6
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: python
          name: python-coverage
          fail_ci_if_error: false

      - name: Check Python coverage threshold (100%)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          COVERAGE=$(python -c "import xml.etree.ElementTree as ET; tree = ET.parse('coverage.xml'); root = tree.getroot(); print(root.attrib['line-rate'])")
          COVERAGE_PCT=$(python -c "print(f'{float('$COVERAGE') * 100:.2f}')")
          echo "Python code coverage: $COVERAGE_PCT%"
          if (( $(echo "$COVERAGE_PCT < 100" | bc -l) )); then
            echo "⚠️  Coverage is below 100% target: $COVERAGE_PCT%"
            echo "Note: Aiming for 100% coverage. Current: $COVERAGE_PCT%"
            # For now, we'll warn but not fail
          else
            echo "✅ Coverage meets 100% target"
          fi
